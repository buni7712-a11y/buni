<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026일정</title>
    <style>
        :root {
            --pdf-border: #666666;
            --pdf-text-dark: #000000;
            --pdf-text-muted: #555555;
            --pdf-holiday: #d9534f;
            --pdf-sat: #0275d8;
            --pdf-lunar: #999999;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            color: var(--pdf-text-dark);
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        /* PDF 스타일의 깔끔한 월 이동 네비게이션 버튼 */
        .pdf-nav {
            display: flex;
            justify-content: flex-start;
            gap: 12px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--pdf-border);
            padding-bottom: 10px;
        }

        .pdf-nav button {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            padding: 4px 8px;
            transition: all 0.2s;
        }

        .pdf-nav button:hover, .pdf-nav button.active {
            color: var(--pdf-text-dark);
            font-weight: bold;
            transform: scale(1.1);
        }

        /* PDF 헤더 구조 */
        .pdf-header {
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .pdf-header .year {
            font-size: 16px;
            font-weight: bold;
            color: var(--pdf-text-muted);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .pdf-header .month-group {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }

        .pdf-header .month-num {
            font-size: 42px;
            font-weight: 800;
            color: var(--pdf-text-dark);
        }

        .pdf-header .month-eng {
            font-size: 20px;
            font-weight: bold;
            color: #777;
            letter-spacing: 2px;
        }

        /* PDF 형태의 격자형 테이블 디자인 */
        .calendar-grid {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .calendar-grid th, .calendar-grid td {
            border: 1px solid var(--pdf-border);
            padding: 10px;
            vertical-align: top;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }

        .calendar-grid th {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding-bottom: 12px;
            color: var(--pdf-text-dark);
            height: auto;
        }

        /* 주말 색상 지정 */
        .calendar-grid th:nth-child(1) { color: var(--pdf-holiday); }
        .calendar-grid th:nth-child(7) { color: var(--pdf-sat); }

        /* 날짜 칸 높이 확보 */
        .calendar-grid td {
            height: 135px;
            position: relative;
            background: #fff;
        }

        /* 날짜 및 공휴일 텍스트 구조 */
        .cell-top {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 4px;
        }

        .date-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .date-number {
            font-size: 16px;
            font-weight: bold;
        }

        /* 일요일 및 토요일 날짜 색상 매칭 */
        .calendar-grid td:nth-child(1) .date-number { color: var(--pdf-holiday); }
        .calendar-grid td:nth-child(7) .date-number { color: var(--pdf-sat); }

        /* 음력 표기 스타일 */
        .lunar-number {
            font-size: 11px;
            font-weight: normal;
            color: var(--pdf-lunar);
        }

        .holiday-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--pdf-holiday);
            margin-top: 1px;
        }

        /* 스케줄 입력창 */
        .schedule-area {
            width: 100%;
            height: 60px;
            border: none;
            resize: none;
            font-size: 12px;
            line-height: 1.4;
            color: #333;
            background: transparent;
            outline: none;
            padding: 0;
            font-family: inherit;
        }

        /* [수정] 색상 선택 바 기본 상태: 숨김(opacity 0) */
        .color-picker-bar {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            border-top: 1px dotted #ccc;
            padding-top: 5px;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none; /* 숨겨져 있을 때는 클릭 안되게 제어 */
            transition: opacity 0.2s ease-in-out;
        }

        /* [수정] 날짜 칸에 마우스가 올라가거나(hover), 포커스 활성화(focus-within)되면 표시 */
        .calendar-grid td:hover .color-picker-bar,
        .calendar-grid td:focus-within .color-picker-bar {
            opacity: 1;
            pointer-events: auto;
        }

        .color-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.1s;
            padding: 0;
        }

        .color-btn:hover {
            transform: scale(1.2);
        }

        .color-btn.none { background-color: #ffffff; position: relative; }
        .color-btn.none::after {
            content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px;
            background-color: red; transform: rotate(-45deg);
        }
        .color-btn.blue { background-color: #e6f2ff; }
        .color-btn.green { background-color: #e6f9ed; }
        .color-btn.yellow { background-color: #fffde6; }
        .color-btn.red { background-color: #ffe6e6; }

        .calendar-grid td:hover {
            box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="pdf-nav" id="pdfNav"></div>

    <div class="pdf-header">
        <div class="year" id="calYear">2026</div>
        <div class="month-group">
            <span class="month-num" id="calMonthNum">01</span>
            <span class="month-eng" id="calMonthEng">JANUARY</span>
        </div>
    </div>

    <table class="calendar-grid">
        <thead>
            <tr style="background: #f1f1f1;">
                <th>일 (Sun)</th>
                <th>월 (Mon)</th>
                <th>화 (Tue)</th>
                <th>수 (Wed)</th>
                <th>목 (Thu)</th>
                <th>금 (Fri)</th>
                <th>토 (Sat)</th>
            </tr>
        </thead>
        <tbody id="calendarBody"></tbody>
    </table>
</div>

<script>
    // 2026년 공휴일 및 삼복(초복, 중복, 말복), 약 10일 간격의 음력 데이터 세팅
    const holidayData = {
        // 1월
        "1-1": { name: "신정", lunar: "음. 11.13" },
        "1-9": { lunar: "음. 11.21" },
        "1-17": { name: "설연휴", lunar: "음. 11.29" },
        "1-18": { name: "설날", lunar: "음. 12.1" },
        "1-19": { name: "설연휴", lunar: "음. 12.2" },
        "1-27": { lunar: "음. 12.10" },
        // 2월
        "2-6": { lunar: "음. 12.20" },
        "2-16": { lunar: "음. 12.30" },
        "2-17": { lunar: "음. 1.1" },
        "2-27": { lunar: "음. 1.11" },
        // 3월
        "3-1": { name: "삼일절" },
        "3-2": { name: "대체공휴일" },
        "3-9": { lunar: "음. 1.21" },
        "3-18": { lunar: "음. 2.1" },
        "3-28": { lunar: "음. 2.11" },
        // 4월
        "4-7": { lunar: "음. 2.21" },
        "4-16": { lunar: "음. 3.1" },
        "4-26": { lunar: "음. 3.11" },
        // 5월
        "5-5": { name: "어린이날" },
        "5-6": { lunar: "음. 3.21" },
        "5-15": { lunar: "음. 3.30" },
        "5-24": { name: "부처님오신날", lunar: "음. 4.8" },
        "5-25": { name: "대체공휴일" },
        // 6월
        "6-3": { name: "2026 지방선거" },
        "6-4": { lunar: "음. 4.19" },
        "6-6": { name: "현충일" },
        "6-14": { lunar: "음. 4.29" },
        "6-24": { lunar: "음. 5.10" },
        // 7월
        "7-4": { lunar: "음. 5.20" },
        "7-10": { name: "재량휴업일" },
        "7-14": { lunar: "음. 6.1" },
        "7-15": { name: "초복" }, 
        "7-17": { name: "제헌절" },
        "7-24": { lunar: "음. 6.11" },
        "7-25": { name: "중복" }, 
        // 8월
        "8-3": { lunar: "음. 6.21" },
        "8-13": { lunar: "음. 7.1" },
        "8-14": { name: "말복" }, 
        "8-15": { name: "광복절" },
        "8-17": { name: "대체공휴일" },
        "8-23": { lunar: "음. 7.11" },
        // 9월
        "9-2": { lunar: "음. 7.21" },
        "9-12": { lunar: "음. 8.2" },
        "9-22": { lunar: "음. 8.12" },
        "9-24": { name: "추석연휴", lunar: "음. 8.14" },
        "9-25": { name: "추석", lunar: "음. 8.15" },
        "9-26": { name: "추석연휴", lunar: "음. 8.16" },
        // 10월
        "10-2": { lunar: "음. 8.22" },
        "10-3": { name: "개천절" },
        "10-5": { name: "대체공휴일" },
        "10-9": { name: "한글날" },
        "10-11": { lunar: "음. 9.1" },
        "10-26": { lunar: "음. 9.16" },
        "10-31": { lunar: "음. 9.21" },
        // 11월
        "11-10": { lunar: "음. 10.1" },
        "11-19": { name: "재량휴업일" },
        "11-20": { name: "재량휴업일", lunar: "음. 10.11" },
        "11-30": { lunar: "음. 10.21" },
        // 12월
        "12-10": { lunar: "음. 11.2" },
        "12-20": { lunar: "음. 11.12" },
        "12-25": { name: "성탄절" },
        "12-29": { lunar: "음. 11.21" }
    };

    const engMonths = [
        "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",
        "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"
    ];

    // 2026년 각 월의 시작 요일 인덱스 및 총 일수
    const monthConfigs = [
        { startDay: 4, totalDays: 31 }, // 1월
        { startDay: 0, totalDays: 28 }, // 2월
        { startDay: 0, totalDays: 31 }, // 3월
        { startDay: 3, totalDays: 30 }, // 4월
        { startDay: 5, totalDays: 31 }, // 5월
        { startDay: 1, totalDays: 30 }, // 6월
        { startDay: 3, totalDays: 31 }, // 7월
        { startDay: 6, totalDays: 31 }, // 8월
        { startDay: 2, totalDays: 30 }, // 9월
        { startDay: 4, totalDays: 31 }, // 10월
        { startDay: 0, totalDays: 30 }, // 11월
        { startDay: 2, totalDays: 31 }  // 12월
    ];

    const pdfNav = document.getElementById('pdfNav');
    for (let i = 0; i < 12; i++) {
        const btn = document.createElement('button');
        btn.textContent = String(i + 1).padStart(2, '0');
        btn.onclick = () => changeMonth(i);
        pdfNav.appendChild(btn);
    }

    function changeMonth(monthIdx) {
        const buttons = pdfNav.querySelectorAll('button');
        buttons.forEach((b, idx) => b.classList.toggle('active', idx === monthIdx));

        document.getElementById('calMonthNum').textContent = String(monthIdx + 1).padStart(2, '0');
        document.getElementById('calMonthEng').textContent = engMonths[monthIdx];

        drawGrid(monthIdx);
    }

    function drawGrid(monthIdx) {
        const tbody = document.getElementById('calendarBody');
        tbody.innerHTML = '';

        const { startDay, totalDays } = monthConfigs[monthIdx];
        let currentDay = 1;
        let rowHtml = '';

        for (let week = 0; week < 6; week++) {
            if (currentDay > totalDays) break;
            rowHtml += '<tr>';

            for (let d = 0; d < 7; d++) {
                if ((week === 0 && d < startDay) || currentDay > totalDays) {
                    rowHtml += '<td></td>';
                } else {
                    const dayKey = `${monthIdx + 1}-${currentDay}`;
                    const dayData = holidayData[dayKey] || {};
                    const holiday = dayData.name || '';
                    const lunar = dayData.lunar || '';
                    
                    const isBoknal = holiday.endsWith('복');
                    const isRealHoliday = (holiday !== '' && !isBoknal);
                    
                    const storageKey = `2026-${String(monthIdx + 1).padStart(2, '0')}-${String(currentDay).padStart(2, '0')}`;
                    
                    const savedDataRaw = localStorage.getItem(storageKey);
                    let savedContent = '';
                    let savedColor = 'transparent';
                    
                    if (savedDataRaw) {
                        try {
                            const parsed = JSON.parse(savedDataRaw);
                            savedContent = parsed.text || '';
                            savedColor = parsed.color || 'transparent';
                        } catch(e) {
                            savedContent = savedDataRaw;
                            savedColor = savedDataRaw.trim() !== '' ? '#e6f2ff' : 'transparent';
                        }
                    }

                    const numStyle = (d === 0 || isRealHoliday) ? 'style="color: var(--pdf-holiday);"' : '';
                    const cellBgStyle = `style="background-color: ${savedColor};"`;

                    rowHtml += `
                        <td ${cellBgStyle} data-cell-id="${storageKey}">
                            <div class="cell-top">
                                <div class="date-row">
                                    <span class="date-number" ${numStyle}>${currentDay}</span>
                                    ${lunar ? `<span class="lunar-number">${lunar}</span>` : ''}
                                </div>
                                ${holiday ? `<span class="holiday-label">${holiday}</span>` : ''}
                            </div>
                            <textarea class="schedule-area" 
                                      data-id="${storageKey}" 
                                      placeholder="" 
                                      oninput="updateStorageText(this)">${savedContent}</textarea>
                            <div class="color-picker-bar">
                                <button class="color-btn none" onclick="changeCellColor(this, 'transparent')" title="색상 해제"></button>
                                <button class="color-btn blue" onclick="changeCellColor(this, '#e6f2ff')" title="연한 파랑"></button>
                                <button class="color-btn green" onclick="changeCellColor(this, '#e6f9ed')" title="연한 녹색"></button>
                                <button class="color-btn yellow" onclick="changeCellColor(this, '#fffde6')" title="연한 노랑"></button>
                                <button class="color-btn red" onclick="changeCellColor(this, '#ffe6e6')" title="연한 빨강"></button>
                            </div>
                        </td>
                    `;
                    currentDay++;
                }
            }
            rowHtml += '</tr>';
        }
        tbody.innerHTML = rowHtml;
    }

    function updateStorageText(target) {
        const key = target.getAttribute('data-id');
        const parentTd = target.closest('td');
        const currentColor = parentTd.style.backgroundColor || 'transparent';
        
        if (target.value.trim() === '' && (currentColor === 'transparent' || currentColor === 'rgba(0, 0, 0, 0)')) {
            localStorage.removeItem(key);
        } else {
            const dataObj = { text: target.value, color: currentColor };
            localStorage.setItem(key, JSON.stringify(dataObj));
        }
    }

    function changeCellColor(btnTarget, colorValue) {
        const parentTd = btnTarget.closest('td');
        const textarea = parentTd.querySelector('.schedule-area');
        const key = textarea.getAttribute('data-id');

        parentTd.style.backgroundColor = colorValue;

        if (textarea.value.trim() === '' && colorValue === 'transparent') {
            localStorage.removeItem(key);
        } else {
            const dataObj = { text: textarea.value, color: colorValue };
            localStorage.setItem(key, JSON.stringify(dataObj));
        }
    }

    const currentMonthIndex = new Date().getMonth();
    changeMonth(currentMonthIndex);
</script>

</body>
</html>
